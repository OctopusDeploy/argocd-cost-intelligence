name: Bug report
description: Something is not working as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Sync an application...
        2. Open the Cost Intelligence tab...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Plugin version
      placeholder: v0.1.0
    validations:
      required: true
  - type: input
    id: argocd
    attributes:
      label: Argo CD version
      placeholder: v3.4.0
    validations:
      required: true
  - type: input
    id: opencost
    attributes:
      label: OpenCost version
      placeholder: 1.121.3
  - type: input
    id: k8s
    attributes:
      label: Kubernetes version and distribution
      placeholder: 1.31, EKS
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Backend logs around the problem. Remove secrets and hostnames you do not want to share.
      render: shell
