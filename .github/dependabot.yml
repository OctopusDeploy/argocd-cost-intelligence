# Routine updates come monthly, as one pull request per ecosystem. Security updates are separate
# and arrive immediately, whatever this file says.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: deps
    groups:
      # Kubernetes libraries have to move together.
      kubernetes:
        patterns: ["k8s.io/*", "sigs.k8s.io/*"]
      go-minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: deps
    # Major versions of the build and lint tools (TypeScript, webpack, ESLint) usually need
    # config changes, and the bundle has to keep running on Argo CD's React 16.14. Upgrade
    # those by hand, in a pull request of their own.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      ui-minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    commit-message:
      prefix: deps
    ignore:
      # The Go version is set by go.mod and CI. Change them together.
      - dependency-name: golang
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: docker
    directory: /ui
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    commit-message:
      prefix: deps
    ignore:
      # Node 22 is what the docs, CI and local setup use.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
