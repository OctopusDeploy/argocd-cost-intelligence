name: CI

# Branches other than main are checked through their pull request, so a PR commit runs CI once.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer commit on a PR cancels the run for the older one. A push to main gets a group of its own,
# since a group keeps only one pending run and merges close together would otherwise drop one.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    name: Go — test & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race ./...

      # Starts PostgreSQL with testcontainers; the runner's Docker is enough.
      - name: Test storage against PostgreSQL
        run: go test -tags=integration -timeout=300s ./pkg/storage/...

      # The mock stands in for OpenCost. REQUIRE_OPENCOST turns "nothing is listening" from a skip
      # into a failure, so a mock that did not start cannot pass the step.
      - name: Test the OpenCost client against the mock
        env:
          REQUIRE_OPENCOST: "1"
        run: |
          node mock-opencost-server.js > mock-opencost.log 2>&1 &
          for _ in $(seq 1 20); do
            curl -sf -o /dev/null http://localhost:9003/health && break
            sleep 0.5
          done
          if ! curl -sf -o /dev/null http://localhost:9003/health; then
            echo "The mock OpenCost did not start:"
            cat mock-opencost.log
            exit 1
          fi
          go test -tags=integration -timeout=120s ./pkg/opencost/...

      - name: Vet
        run: go vet -tags=integration ./...

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a  # v9.3.0
        with:
          version: v2.14.0
          args: --build-tags=integration

      - name: Go modules are tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

  ui:
    name: UI — test, build & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ui

      - name: Build
        run: npm run build
        working-directory: ui

      - name: Lint
        run: npm run lint
        working-directory: ui

      - name: Type check
        run: npm run typecheck
        working-directory: ui

      - name: Test
        run: npm test
        working-directory: ui

      - name: No generated declaration files in src
        run: test -z "$(find src -name '*.d.ts')"
        working-directory: ui

  # Nothing is pushed. This catches a broken Dockerfile before a release does.
  images:
    name: Images — ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            tag: argocd-cost-intelligence:ci
            context: .
          - image: UI
            tag: argocd-cost-intelligence-ui:ci
            context: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Build
        run: docker build -t ${{ matrix.tag }} ${{ matrix.context }}

  helm:
    name: Helm — lint & template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5.0.1

      - name: Lint
        run: helm lint ./helm --set postgres.auth.password=ci-test

      - name: Template (default values)
        run: |
          helm template argocd-cost-intelligence ./helm \
            --set postgres.auth.password=ci-test

      - name: Template (local values)
        run: |
          helm template argocd-cost-intelligence ./helm \
            -f helm/values-local.yaml \
            --set postgres.auth.password=ci-test

      - name: Template (metrics off)
        run: |
          helm template argocd-cost-intelligence ./helm \
            --set postgres.auth.password=ci-test --set metrics.enabled=false

      - name: Template (Prometheus Operator)
        run: |
          helm template argocd-cost-intelligence ./helm \
            --set postgres.auth.password=ci-test \
            --set metrics.serviceMonitor.enabled=true --set metrics.prometheusRule.enabled=true

  # Each step is a Makefile target, so the same check runs locally with `make <target>`. The tools
  # run in containers whose versions are pinned in the Makefile.
  lint:
    name: Lint — workflows, manifests, Dockerfiles, scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5.0.1

      - name: GitHub workflows (actionlint)
        run: make lint-actions

      - name: Kubernetes manifests (kubeconform)
        run: make lint-manifests

      - name: Dockerfiles (hadolint)
        run: make lint-dockerfile

      - name: Shell scripts (shellcheck)
        run: make lint-shell

      - name: Embedded mock OpenCost
        run: make lint-mock

      - name: Argo CD settings in deploy/ and docs/ match the hook
        run: make lint-notifications

  prometheus-rules:
    name: Prometheus rules — check & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Check and test
        run: |
          docker run --rm -v "$PWD:/w" -w /w --entrypoint sh prom/prometheus:v3.15.0 -c \
            'promtool check rules helm/files/prometheus-rules.yaml && promtool test rules test/prometheus/*_test.yaml'

  security:
    name: Security — vulnerabilities & secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      # The latest 1.27 patch, so the standard library is checked at its fixed
      # version rather than the exact one in go.mod. Update with go.mod.
      # check-latest skips the runner's tool cache, which can lag a release.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: '1.27'
          check-latest: true
          cache: true

      - name: Go vulnerabilities (govulncheck)
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # The plugin ships only production dependencies; dev tooling is not gated.
      - name: npm vulnerabilities (production dependencies)
        run: npm audit --omit=dev --audit-level=high
        working-directory: ui

      # Scans the whole history, using .gitleaks.toml at the repository root.
      - name: Secrets (gitleaks)
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1 detect --source /repo --redact --verbose
