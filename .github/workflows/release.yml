name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: read

# Two pushes of the same tag must not interleave their package pushes.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# GHCR and Helm only accept lowercase names, and github.repository keeps the repo's
# capitals (OctopusDeploy), so the names are spelled out. They must match the docs and values.yaml.
env:
  BACKEND_IMAGE: ghcr.io/octopusdeploy/argocd-cost-intelligence
  UI_IMAGE: ghcr.io/octopusdeploy/argocd-cost-intelligence-ui
  CHART_REGISTRY: ghcr.io/octopusdeploy/charts

jobs:
  # ── Checks ──────────────────────────────────────────────────────────────────
  # A tag must not publish images that fail the tests.
  verify:
    name: Test before publishing
    runs-on: ubuntu-latest
    steps:
      # The trigger pattern is loose (it cannot express the pre-release part), and `helm package`
      # would fail on a name like v1.2.3.4 after the images were already pushed.
      - name: Tag is a version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$TAG' is not vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-prerelease"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Go tests
        run: go test ./...

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: UI checks
        working-directory: ui
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test
          npm run build

      # For installs that add the plugin with the Argo CD extension installer instead of the hook
      # (docs/gitops-install.md). The docs link to these two file names; keep them. Packaged here,
      # from the bundle just checked, so the job with write access runs no npm.
      - name: Package the UI extension
        run: scripts/package-ui-extension.sh dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ui-extension
          path: |
            dist/extension.tar.gz
            dist/extension_checksums.txt
          if-no-files-found: error
          # A re-run of all jobs keeps the run's artifacts.
          overwrite: true

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5.0.1

      - name: Helm lint
        run: helm lint ./helm --set postgres.auth.password=ci-test

  # ── Docker images ───────────────────────────────────────────────────────────
  docker-backend:
    needs: verify
    name: Build & push backend image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Extract version
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: tags
        env:
          IMAGE: ${{ env.BACKEND_IMAGE }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          {
            echo "list<<EOF"
            echo "${IMAGE}:${TAG}"
            # The chart's default image tag is its appVersion, which has no leading v
            echo "${IMAGE}:${TAG#v}"
            # Pre-releases (v1.2.3-rc.1) must not move :latest
            case "$TAG" in *-*) ;; *) echo "${IMAGE}:latest" ;; esac
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build & push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.list }}
          labels: |
            org.opencontainers.image.title=argocd-cost-intelligence
            org.opencontainers.image.version=${{ steps.version.outputs.tag }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          # GHCR reads the repository link from the index of a multi-platform image, not from the
          # labels, which sit in each platform's config. An unlinked package can refuse a later push.
          annotations: |
            index:org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

  docker-ui:
    needs: verify
    name: Build & push UI image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Extract version
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: tags
        env:
          IMAGE: ${{ env.UI_IMAGE }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          {
            echo "list<<EOF"
            echo "${IMAGE}:${TAG}"
            # The chart's default image tag is its appVersion, which has no leading v
            echo "${IMAGE}:${TAG#v}"
            # Pre-releases (v1.2.3-rc.1) must not move :latest
            case "$TAG" in *-*) ;; *) echo "${IMAGE}:latest" ;; esac
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build & push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: ./ui
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.list }}
          labels: |
            org.opencontainers.image.title=argocd-cost-intelligence-ui
            org.opencontainers.image.version=${{ steps.version.outputs.tag }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          # GHCR reads the repository link from the index of a multi-platform image, not from the
          # labels, which sit in each platform's config. An unlinked package can refuse a later push.
          annotations: |
            index:org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

  # ── Helm chart ──────────────────────────────────────────────────────────────
  helm-publish:
    name: Package & push Helm chart
    runs-on: ubuntu-latest
    needs: [docker-backend, docker-ui]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5.0.1

      # Strip leading 'v' — Helm chart versions are plain semver (0.1.0 not v0.1.0)
      - name: Extract chart version
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR (Helm OCI)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            --username "${{ github.actor }}" --password-stdin

      - name: Package chart
        run: |
          helm package ./helm \
            --version "${{ steps.version.outputs.tag }}" \
            --app-version "${{ steps.version.outputs.tag }}"

      - name: Push chart to OCI registry
        run: |
          helm push "argocd-cost-intelligence-${{ steps.version.outputs.tag }}.tgz" \
            "oci://${{ env.CHART_REGISTRY }}"

  # ── GitHub Release ───────────────────────────────────────────────────────────
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [verify, docker-backend, docker-ui, helm-publish]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Extract version
        id: version
        run: |
          echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          echo "semver=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: ui-extension
          path: dist

      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            dist/extension.tar.gz
            dist/extension_checksums.txt
          body: |
            ## Install with Helm

            ```bash
            helm install argocd-cost-intelligence \
              oci://${{ env.CHART_REGISTRY }}/argocd-cost-intelligence \
              --version ${{ steps.version.outputs.semver }} \
              --namespace argocd-cost-intel --create-namespace \
              --set namespace.create=false \
              --set postgres.auth.password=<your-password>
            ```

            ## Images

            | Component | Image |
            |-----------|-------|
            | Backend | `${{ env.BACKEND_IMAGE }}:${{ steps.version.outputs.tag }}` |
            | UI | `${{ env.UI_IMAGE }}:${{ steps.version.outputs.tag }}` |

            ## UI extension

            `extension.tar.gz` and `extension_checksums.txt` below are the UI plugin for the [Argo CD extension installer](https://github.com/argoproj-labs/argocd-extension-installer), for installs where Git manages Argo CD. See [Install when Git manages Argo CD](${{ github.server_url }}/${{ github.repository }}/blob/${{ steps.version.outputs.tag }}/docs/gitops-install.md#use-the-argo-cd-extension-installer-instead).

            ---
