name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  BACKEND_IMAGE: ghcr.io/${{ github.repository }}
  UI_IMAGE: ghcr.io/${{ github.repository }}-ui
  CHART_REGISTRY: ghcr.io/${{ github.repository_owner }}/charts

jobs:
  # ── Checks ──────────────────────────────────────────────────────────────────
  # A tag must not publish images that fail the tests.
  verify:
    name: Test before publishing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Go tests
        run: go test ./...

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: UI checks
        working-directory: ui
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test
          npm run build

      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4  # v4

      - name: Helm lint
        run: helm lint ./helm --set postgres.auth.password=ci-test

  # ── Docker images ───────────────────────────────────────────────────────────
  docker-backend:
    needs: verify
    name: Build & push backend image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Extract version
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130  # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: tags
        env:
          IMAGE: ${{ env.BACKEND_IMAGE }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          {
            echo "list<<EOF"
            echo "${IMAGE}:${TAG}"
            # The chart's default image tag is its appVersion, which has no leading v
            echo "${IMAGE}:${TAG#v}"
            # Pre-releases (v1.2.3-rc.1) must not move :latest
            case "$TAG" in *-*) ;; *) echo "${IMAGE}:latest" ;; esac
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build & push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.list }}
          labels: |
            org.opencontainers.image.title=argocd-cost-intelligence
            org.opencontainers.image.version=${{ steps.version.outputs.tag }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-ui:
    needs: verify
    name: Build & push UI image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Extract version
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130  # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: tags
        env:
          IMAGE: ${{ env.UI_IMAGE }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          {
            echo "list<<EOF"
            echo "${IMAGE}:${TAG}"
            # The chart's default image tag is its appVersion, which has no leading v
            echo "${IMAGE}:${TAG#v}"
            # Pre-releases (v1.2.3-rc.1) must not move :latest
            case "$TAG" in *-*) ;; *) echo "${IMAGE}:latest" ;; esac
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build & push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: ./ui
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.list }}
          labels: |
            org.opencontainers.image.title=argocd-cost-intelligence-ui
            org.opencontainers.image.version=${{ steps.version.outputs.tag }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Helm chart ──────────────────────────────────────────────────────────────
  helm-publish:
    name: Package & push Helm chart
    runs-on: ubuntu-latest
    needs: [docker-backend, docker-ui]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4  # v4

      # Strip leading 'v' — Helm chart versions are plain semver (0.1.0 not v0.1.0)
      - name: Extract chart version
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR (Helm OCI)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            --username "${{ github.actor }}" --password-stdin

      - name: Package chart
        run: |
          helm package ./helm \
            --version "${{ steps.version.outputs.tag }}" \
            --app-version "${{ steps.version.outputs.tag }}"

      - name: Push chart to OCI registry
        run: |
          helm push "argocd-cost-intelligence-${{ steps.version.outputs.tag }}.tgz" \
            "oci://${{ env.CHART_REGISTRY }}"

  # ── GitHub Release ───────────────────────────────────────────────────────────
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [docker-backend, docker-ui, helm-publish]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Extract version
        id: version
        run: |
          echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          echo "semver=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            ## Install with Helm

            ```bash
            helm install argocd-cost-intelligence \
              oci://ghcr.io/${{ github.repository_owner }}/charts/argocd-cost-intelligence \
              --version ${{ steps.version.outputs.semver }} \
              --namespace argocd-cost-intel --create-namespace \
              --set namespace.create=false \
              --set postgres.auth.password=<your-password>
            ```

            ## Images

            | Component | Image |
            |-----------|-------|
            | Backend | `${{ env.BACKEND_IMAGE }}:${{ steps.version.outputs.tag }}` |
            | UI | `${{ env.UI_IMAGE }}:${{ steps.version.outputs.tag }}` |

            ---
