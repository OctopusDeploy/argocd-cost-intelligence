# This ConfigMap patch should be applied to the argocd-notifications-cm in the argocd namespace
# kubectl patch cm argocd-notifications-cm -n argocd --patch-file deploy/argocd-notifications-patch.yaml
#
# The webhook sends the token stored under cost-intel-webhook-token in argocd-notifications-secret
# ($cost-intel-webhook-token below). Copy it there from the service's Secret first:
#   TOKEN_B64=$(kubectl get secret argocd-cost-intelligence-webhook -n argocd-cost-intel -o jsonpath='{.data.token}')
#   kubectl patch secret argocd-notifications-secret -n argocd --type merge \
#     -p "{\"data\":{\"cost-intel-webhook-token\":\"${TOKEN_B64}\"}}"
#
# Every key here is named after cost-intel, so the patch leaves your own triggers and templates
# alone. It doesn't set `subscriptions`: that is one key for every subscription you have, and a
# patch would replace it. Add this entry to the list in `subscriptions` yourself:
#   - recipients:
#     - cost-intel
#     triggers:
#     - cost-intel-on-sync-succeeded
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-notifications-cm
  namespace: argocd
data:
  service.webhook.cost-intel: |
    url: http://argocd-cost-intelligence.argocd-cost-intel.svc.cluster.local:8080/api/cost-analysis/on-sync
    headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer $cost-intel-webhook-token

  trigger.cost-intel-on-sync-succeeded: |
    - when: app.status.operationState.phase in ["Succeeded"] and app.status.operationState.finishedAt != ""
      oncePer: app.status.operationState.finishedAt
      send: [cost-intel-sync-succeeded]

  template.cost-intel-sync-succeeded: |
    webhook:
      cost-intel:
        method: POST
        headers:
        - name: Content-Type
          value: application/json
        body: |
          {
            "applicationName": "{{.app.metadata.name}}",
            "applicationNamespace": "{{.app.metadata.namespace}}",
            "namespace": "{{.app.spec.destination.namespace}}",
            "resources": [{{range $i, $r := .app.status.resources}}{{if $i}}, {{end}}{"kind": "{{$r.kind}}", "name": "{{$r.name}}", "namespace": "{{with index $r "namespace"}}{{.}}{{end}}"}{{end}}],
            "syncTimestamp": "{{.app.status.operationState.finishedAt}}",
            "syncResult": "Succeeded"
          }
