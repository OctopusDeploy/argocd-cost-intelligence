apiVersion: v1
kind: ServiceAccount
metadata:
  name: argocd-cost-intelligence
  namespace: argocd-cost-intel

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: argocd-cost-intelligence
rules:
- apiGroups:
  - ""
  resources:
  - namespaces
  - pods
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - argoproj.io
  resources:
  - applications
  verbs:
  - get
  - list
  - watch
# Rightsizing reads the Vertical Pod Autoscaler's recommendations (Goldilocks or any VPA). Read only.
- apiGroups:
  - autoscaling.k8s.io
  resources:
  - verticalpodautoscalers
  verbs:
  - get
  - list

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: argocd-cost-intelligence
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: argocd-cost-intelligence
subjects:
- kind: ServiceAccount
  name: argocd-cost-intelligence
  namespace: argocd-cost-intel
