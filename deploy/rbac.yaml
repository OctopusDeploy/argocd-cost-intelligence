apiVersion: v1
kind: ServiceAccount
metadata:
  name: cost-intelligence-argocd
  namespace: cost-intelligence

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cost-intelligence-argocd
rules:
- apiGroups:
  - ""
  resources:
  - namespaces
  - pods
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - argoproj.io
  resources:
  - applications
  verbs:
  - get
  - list
  - watch
# Rightsizing reads the Vertical Pod Autoscaler's recommendations (Goldilocks or any VPA). Read only.
- apiGroups:
  - autoscaling.k8s.io
  resources:
  - verticalpodautoscalers
  verbs:
  - get
  - list

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cost-intelligence-argocd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cost-intelligence-argocd
subjects:
- kind: ServiceAccount
  name: cost-intelligence-argocd
  namespace: cost-intelligence

---
# Reads its own Deployment's Argo CD tracking annotation to find the Application that installed it,
# which gates cluster-wide cost data. That Deployment only.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cost-intelligence-argocd-self
  namespace: cost-intelligence
rules:
- apiGroups:
  - apps
  resources:
  - deployments
  resourceNames:
  - cost-intelligence-argocd
  verbs:
  - get

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cost-intelligence-argocd-self
  namespace: cost-intelligence
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cost-intelligence-argocd-self
subjects:
- kind: ServiceAccount
  name: cost-intelligence-argocd
  namespace: cost-intelligence
