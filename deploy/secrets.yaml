apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: cost-intelligence
type: Opaque
stringData:
  password: "change-me-in-production"
  username: "cost_user"

---
apiVersion: v1
kind: Secret
metadata:
  name: cost-intelligence-config
  namespace: cost-intelligence
type: Opaque
stringData:
  opencost-base-url: "http://opencost.opencost:9003"

---
# Bearer token Argo CD Notifications sends to POST /on-sync. The placeholder is too short on
# purpose: the service refuses to start until it is replaced with at least 16 random characters,
# e.g. `openssl rand -hex 24`. Put the same value in argocd-notifications-secret (see
# argocd-notifications-patch.yaml).
apiVersion: v1
kind: Secret
metadata:
  name: cost-intelligence-argocd-webhook
  namespace: cost-intelligence
type: Opaque
stringData:
  token: "CHANGE-ME"
