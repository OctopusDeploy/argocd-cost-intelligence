{{- if .Values.rbac.create }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Values.rbac.roleName }}
  labels:
    {{- include "cost-intelligence-argocd.labels" . | nindent 4 }}
rules:
- apiGroups:
  - ""
  resources:
  - namespaces
  - pods
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - argoproj.io
  resources:
  - applications
  verbs:
  - get
  - list
  - watch
{{- if .Values.costIntelligence.vpa.enabled }}
# Rightsizing reads the Vertical Pod Autoscaler's recommendations (Goldilocks or any VPA). Read only.
- apiGroups:
  - autoscaling.k8s.io
  resources:
  - verticalpodautoscalers
  verbs:
  - get
  - list
{{- end }}

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Values.rbac.roleBindingName }}
  labels:
    {{- include "cost-intelligence-argocd.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Values.rbac.roleName }}
subjects:
- kind: ServiceAccount
  name: {{ include "cost-intelligence-argocd.serviceAccountName" . }}
  namespace: {{ .Values.namespace.name }}

---
# The service reads its own Deployment's Argo CD tracking annotation to find the Application that
# installed it, which gates cluster-wide cost data. That Deployment only.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "cost-intelligence-argocd.fullname" . }}-self
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "cost-intelligence-argocd.labels" . | nindent 4 }}
rules:
- apiGroups:
  - apps
  resources:
  - deployments
  resourceNames:
  - {{ include "cost-intelligence-argocd.fullname" . }}
  verbs:
  - get

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "cost-intelligence-argocd.fullname" . }}-self
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "cost-intelligence-argocd.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "cost-intelligence-argocd.fullname" . }}-self
subjects:
- kind: ServiceAccount
  name: {{ include "cost-intelligence-argocd.serviceAccountName" . }}
  namespace: {{ .Values.namespace.name }}
{{- end }}
