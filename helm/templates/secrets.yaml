{{- if not .Values.webhook.existingSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cost-intelligence-argocd.webhook.secretName" . }}
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "cost-intelligence-argocd.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ include "cost-intelligence-argocd.webhook.token" . | quote }}
{{- end }}

{{- if not .Values.postgres.auth.existingSecret }}
{{- $pgSecretName := include "cost-intelligence-argocd.postgres.secretName" . }}
{{- $pgExisting := lookup "v1" "Secret" .Values.namespace.name $pgSecretName }}
{{- $pgPassword := "" }}
{{- if and $pgExisting $pgExisting.data (index $pgExisting.data "password") }}
{{- $pgPassword = index $pgExisting.data "password" | b64dec }}
{{- else }}
{{- $pgPassword = required "postgres.auth.password is required on first install. Supply it with --set postgres.auth.password=<value>, a private values override file (never commit credentials), or set postgres.auth.existingSecret to the name of a pre-existing Secret containing 'username' and 'password' keys." .Values.postgres.auth.password }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $pgSecretName }}
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "cost-intelligence-argocd.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ .Values.postgres.auth.username | quote }}
  password: {{ $pgPassword | quote }}
{{- end }}

---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cost-intelligence-argocd.openCost.secretName" . }}
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "cost-intelligence-argocd.labels" . | nindent 4 }}
type: Opaque
stringData:
  opencost-base-url: {{ .Values.openCost.baseURL | quote }}
