# Minimal Values - Single Replica, Small Storage
# Usage: helm install argocd-cost-intelligence ./helm -f values-minimal.yaml \
#          --set postgres.auth.password="your-secure-password"

namespace:
  create: true
  name: argocd-cost-intel

costIntelligence:
  replicaCount: 1
  image:
    repository: ghcr.io/octopusdeploy/argocd-cost-intelligence
    tag: ""  # defaults to chart appVersion
    pullPolicy: IfNotPresent

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

  autoscaling:
    enabled: false

postgres:
  enabled: true
  replicaCount: 1

  persistence:
    enabled: true
    storageClassName: ""  # Use default
    size: 10Gi

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 512Mi

openCost:
  baseURL: http://opencost.opencost:9003
  timeout: 10s

argoCd:
  namespace: argocd

security:
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000

  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true

healthChecks:
  livenessProbe:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 30

  readinessProbe:
    enabled: true
    initialDelaySeconds: 10
    periodSeconds: 10

ingress:
  enabled: false

commonLabels:
  environment: development
