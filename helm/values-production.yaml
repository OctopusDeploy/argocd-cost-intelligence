# Production Values - High Availability Setup
# Usage: helm install argocd-cost-intelligence ./helm -f values-production.yaml

namespace:
  create: true
  name: argocd-cost-intel

costIntelligence:
  replicaCount: 3
  image:
    repository: ghcr.io/octopusdeploy/argocd-cost-intelligence
    tag: ""  # defaults to chart appVersion; pin to a specific release tag in production
    pullPolicy: IfNotPresent

  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 60
    targetMemoryUtilizationPercentage: 75

postgres:
  enabled: true
  replicaCount: 1

  persistence:
    enabled: true
    storageClassName: fast-ssd  # Change to your storage class
    size: 100Gi

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi

openCost:
  baseURL: http://opencost.opencost:9003
  timeout: 30s

argoCd:
  namespace: argocd

security:
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault

  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    capabilities:
      drop:
        - ALL

healthChecks:
  livenessProbe:
    enabled: true
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  readinessProbe:
    enabled: true
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 5
    failureThreshold: 3

# Off: an Ingress bypasses Argo CD's extension proxy, which is what authorizes API
# requests, and the NetworkPolicy blocks the ingress controller anyway.
# Users reach cost data through the Argo CD UI.
ingress:
  enabled: false
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/rate-limit: "100"
  hosts:
    - host: cost-intel.prod.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: cost-intel-tls
      hosts:
        - cost-intel.prod.example.com

nodeSelector:
  workload: platform-services

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - argocd-cost-intelligence
          topologyKey: kubernetes.io/hostname

tolerations: []

commonLabels:
  environment: production
  team: platform

features:
  autoPatchArgoCd: true
