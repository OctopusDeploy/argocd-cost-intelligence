site_name: ArgoCD Cost Intelligence
site_description: The actual cost of each Argo CD application, measured with OpenCost
site_url: !ENV [READTHEDOCS_CANONICAL_URL, https://argocd-cost-intelligence.readthedocs.io/en/latest/]
repo_url: https://github.com/OctopusDeploy/argocd-cost-intelligence
edit_uri: edit/main/docs/

# The home page is the README and links to files outside docs/ point at GitHub;
# see scripts/mkdocs_hooks.py.
hooks:
- scripts/mkdocs_hooks.py

strict: true
# Pinned for the build, not a page of the site.
exclude_docs: requirements.txt
# The home page and the hook live outside docs/; rebuild on their changes too.
watch:
- README.md
- scripts
validation:
  links:
    anchors: warn

markdown_extensions:
- admonition
- attr_list
- footnotes
- md_in_html
- tables
- pymdownx.highlight
- pymdownx.superfences
- toc:
    permalink: true

nav:
- Introduction: index.md
- Using it:
  - Installation: installation.md
  - Install when Git manages Argo CD: gitops-install.md
  - Configuration: configuration.md
  - Operations: operations.md
  - Prometheus metrics: metrics.md
- Contributing:
  - Architecture: architecture.md
  - Development: development.md

theme:
  name: material
  font:
    text: Inter
  features:
  - content.action.edit
  - content.code.copy
  - navigation.footer
  palette:
  - media: '(prefers-color-scheme: light)'
    scheme: default
    primary: custom
    accent: custom
    toggle:
      icon: material/toggle-switch-off-outline
      name: Switch to dark mode
  - media: '(prefers-color-scheme: dark)'
    scheme: slate
    primary: custom
    accent: custom
    toggle:
      icon: material/toggle-switch
      name: Switch to light mode

extra_css:
- stylesheets/extra.css
