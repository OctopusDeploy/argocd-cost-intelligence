site_name: ArgoCD Cost Intelligence
site_description: The actual cost of each Argo CD application, measured with OpenCost
site_url: !ENV [READTHEDOCS_CANONICAL_URL, https://argocd-cost-intelligence.readthedocs.io/en/latest/]
repo_url: https://github.com/OctopusDeploy/argocd-cost-intelligence
edit_uri: edit/main/docs/
copyright: Maintained by <a href="https://octopus.com">Octopus Deploy</a> · Licensed under <a href="https://github.com/OctopusDeploy/argocd-cost-intelligence/blob/main/LICENSE">Apache-2.0</a><br>Argo, OpenCost and Kubernetes are trademarks of The Linux Foundation. Octopus Deploy and its logo are trademarks of Octopus Deploy.

# The home page is the README, the Roadmap and Security pages are ROADMAP.md and SECURITY.md,
# and links to other files outside docs/ point at GitHub; see scripts/mkdocs_hooks.py.
hooks:
- scripts/mkdocs_hooks.py

strict: true
# Pinned for the build, not a page of the site.
exclude_docs: requirements.txt
# The generated pages and the hook live outside docs/; rebuild on their changes too.
watch:
- README.md
- ROADMAP.md
- SECURITY.md
- scripts
validation:
  links:
    anchors: warn

markdown_extensions:
- admonition
- attr_list
- footnotes
- md_in_html
- tables
- pymdownx.highlight
- pymdownx.superfences:
    custom_fences:
    - name: mermaid
      class: mermaid
      format: !!python/name:pymdownx.superfences.fence_code_format
- toc:
    permalink: true

nav:
- Introduction: index.md
- Using it:
  - How costs are measured: how-costs-are-measured.md
  - Limits and requirements: limits-and-requirements.md
  - Installation: installation.md
  - Install when Git manages Argo CD: gitops-install.md
  - Configuration: configuration.md
  - Operations: operations.md
  - Prometheus metrics: metrics.md
- Contributing:
  - Architecture: architecture.md
  - Development: development.md
  - Roadmap: roadmap.md
  - Security: security.md
  - Contributors: contributors/index.html

theme:
  name: material
  # The octoicon is the path from Octopus's official logo pack, the same as the plugin's BrandMark:
  # white on the blue header, in the pack's blue as the favicon.
  logo: assets/octoicon-white.svg
  favicon: assets/octoicon.svg
  font:
    text: Inter
  features:
  - content.action.edit
  - content.code.copy
  - navigation.footer
  - navigation.sections
  - navigation.top
  - search.highlight
  palette:
  - media: '(prefers-color-scheme: light)'
    scheme: default
    primary: custom
    accent: custom
    toggle:
      icon: material/toggle-switch-off-outline
      name: Switch to dark mode
  - media: '(prefers-color-scheme: dark)'
    scheme: slate
    primary: custom
    accent: custom
    toggle:
      icon: material/toggle-switch
      name: Switch to light mode

extra:
  social:
  - icon: fontawesome/brands/github
    link: https://github.com/OctopusDeploy/argocd-cost-intelligence
    name: argocd-cost-intelligence on GitHub

extra_css:
- stylesheets/extra.css
